name: Install Fixed Repository

on:
  push:
    paths:
      - "preethub-complete-fixed.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract fixed repository
        run: |
          mkdir -p /tmp/fixed
          unzip -o preethub-complete-fixed.zip -d /tmp/fixed

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'preethub-complete-fixed.zip' \
            -exec rm -rf {} +

          cp -a /tmp/fixed/. .

          rm -f preethub-complete-fixed.zip

      - name: Commit fixed repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix complete Preethub repository" || exit 0
          git push
